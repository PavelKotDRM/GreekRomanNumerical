[package]
name = "greekromannumerical-native"
version = "1.1.1"
edition = "2024"
description = "Native Rust backend for GreekRomanUtils conversions"
license-file = "LICENSE"
repository = "https://github.com/PavelKotDRM/GreekRomanNumerical"
homepage = "https://github.com/PavelKotDRM/GreekRomanNumerical"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
greekromannumerical-core = { path = "../greekromannumerical-core" }
# PyO3's num-bigint conversion support uses 0.4; the core library uses 0.5.
core-bigint = { package = "num-bigint", version = "0.5" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311", "num-bigint"] }
num-bigint = "0.5"
