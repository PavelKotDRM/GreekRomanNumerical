[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "GreekRomanUtils"
version = "1.4.0"
description = "The module converts Arabic numerals to Greek and Roman numbers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "PKALab", email = "kpalab@pkotlyarov.ru"}
]
keywords = ["python", "greek", "roman"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/PavelKotDRM/GreekRomanNumerical"
Documentation = "https://github.com/PavelKotDRM/GreekRomanNumerical"

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
notebook = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.4",
    "notebook>=7.6.3",
]
performance = [
    "pytest-benchmark>=5.3.0",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "GreekRomanUtils._native"
python-source = "."
features = ["pyo3/extension-module"]
include = ["LICENSE"]

[tool.ruff.lint.per-file-ignores]
"GreekRomanUtils/**/*.py" = ["N999"]
