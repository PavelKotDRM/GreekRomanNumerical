# Continuous integration: verifies the core submodule version tag, runs the test matrix,
# and checks that the newest greekromannumerical-core tag still builds. Reused by wheels.yml.

name: CI

on:
  schedule:
    # Weekly check that the newest greekromannumerical-core tag still builds and passes tests.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        type: string
        default: ""
      skip-latest-core:
        description: "Skip building and testing against the newest core tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core-submodule:
    name: Core submodule tag
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.ref }}
        submodules: recursive
        token: ${{ secrets.CORE_SUBMODULE_TOKEN || github.token }}

    - name: Verify submodule matches the pinned version tag
      run: python3 scripts/core_submodule.py check

  test:
    name: Python ${{ matrix.python-version }}
    needs: core-submodule
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.16.0a2"]
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.ref }}
        submodules: recursive
        token: ${{ secrets.CORE_SUBMODULE_TOKEN || github.token }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install "${{ matrix.python-version }}"
    
    - name: Install dependencies
      run: uv sync --locked --group dev --python "${{ matrix.python-version }}"

    - name: Run typecheck
      run: uv run ty check --exclude tests/

    - name: Run linting
      run: uv run ruff check --exclude tests/
    
    - name: Run tests (Python-only backend)
      env:
        GREEKROMAN_FORCE_PYTHON: "1"
      run: uv run pytest tests/ -v

    - name: Enable PyO3 forward compatibility for Python 3.16 alpha
      if: matrix.python-version == '3.16.0a2'
      run: echo "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1" >> "$GITHUB_ENV"

    - name: Build Rust extension for hybrid tests
      run: uv run maturin develop --manifest-path rust/Cargo.toml

    - name: Run tests (Hybrid backend)
      run: uv run pytest tests/ -v
    
    - name: Build package
      run: uv build

  core-latest:
    name: Latest core tag
    needs: core-submodule
    if: ${{ !inputs.skip-latest-core }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.ref }}
        submodules: recursive
        token: ${{ secrets.CORE_SUBMODULE_TOKEN || github.token }}

    - name: Check out the newest core version tag
      id: core
      run: python3 scripts/core_submodule.py sync --latest

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Install dependencies
      run: uv sync --locked --group dev

    - name: Run core tests
      run: cargo test --manifest-path greekromannumerical-core/Cargo.toml

    - name: Build Rust extension against core ${{ steps.core.outputs.tag }}
      run: uv run maturin develop --manifest-path rust/Cargo.toml

    - name: Run tests (Hybrid backend)
      run: uv run pytest tests/ -v
