name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15.0rc2"]
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install "${{ matrix.python-version }}"
    
    - name: Install dependencies
      run: uv sync --locked --group dev --python "${{ matrix.python-version }}"

    - name: Run typecheck
      run: uv run ty check --exclude tests/

    - name: Run linting
      run: uv run ruff check --exclude tests/
    
    - name: Run tests (Python-only backend)
      env:
        GREEKROMAN_FORCE_PYTHON: "1"
      run: uv run pytest tests/ -v

    - name: Build Rust extension for hybrid tests
      run: uv run maturin develop --manifest-path rust/Cargo.toml

    - name: Run tests (Hybrid backend)
      run: uv run pytest tests/ -v
    
    - name: Build package
      run: uv build
      
